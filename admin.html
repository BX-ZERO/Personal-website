<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BXZERO — 写作台</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 只属于写作台的样式 */
  .admin {
    max-width: 1180px;
    margin: 0 auto;
    padding: 110px 28px 90px;
  }

  .admin h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .01em;
  }

  .admin .sub {
    margin: 0 0 30px;
    font-size: 12.5px;
    letter-spacing: .16em;
    color: var(--dimmer);
  }

  .pane {
    border: 1px solid var(--line);
    background: rgba(12, 18, 24, .55);
    padding: 20px 22px;
  }

  .pane + .pane { margin-top: 18px; }

  .pane-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  .pane-head h2 {
    margin: 0;
    font-family: var(--font-en);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .24em;
    color: var(--dim);
  }

  .pane-head .cn {
    font-family: var(--font-cn);
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--dimmer);
  }

  .pane-head .fill { flex: 1; }

  .grid2 {
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    gap: 18px;
    align-items: start;
  }

  .field { margin-bottom: 14px; }

  .field > label {
    display: block;
    margin-bottom: 7px;
    font-size: 11.5px;
    letter-spacing: .18em;
    color: var(--dimmer);
  }

  input[type="text"],
  input[type="password"],
  input[type="date"],
  textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text);
    background: rgba(6, 10, 14, .8);
    border: 1px solid var(--line-strong);
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  input:focus,
  textarea:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 2px rgba(53, 216, 255, .1);
  }

  textarea {
    min-height: 300px;
    resize: vertical;
    line-height: 1.75;
  }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .btn {
    padding: 9px 18px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line-strong);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, background .2s ease;
  }

  .btn:hover:not(:disabled) {
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(53, 216, 255, .06);
  }

  .btn:disabled { opacity: .4; cursor: default; }

  .btn.primary {
    color: #041018;
    background: var(--cyan);
    border-color: var(--cyan);
    font-weight: 700;
  }

  .btn.primary:hover:not(:disabled) {
    color: #041018;
    background: #6ee4ff;
  }

  .btn.danger:hover:not(:disabled) {
    color: var(--orange);
    border-color: var(--orange);
    background: rgba(255, 122, 26, .07);
  }

  .entries {
    margin: 0;
    padding: 0;
    list-style: none;
    max-height: 420px;
    overflow-y: auto;
  }

  .entry {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 10px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .2s ease;
  }

  .entry:hover { background: rgba(53, 216, 255, .05); }

  .entry.is-on {
    background: rgba(53, 216, 255, .09);
    box-shadow: inset 2px 0 0 var(--cyan);
  }

  .entry time {
    flex: none;
    font-family: var(--font-en);
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--dimmer);
  }

  .entry span {
    font-size: 13.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .status {
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--dimmer);
    min-height: 18px;
  }

  .status.ok { color: var(--cyan); }
  .status.err { color: var(--orange); }

  .hint {
    font-size: 12px;
    line-height: 1.8;
    color: var(--dimmer);
  }

  .hint code {
    font-family: var(--font-en);
    font-size: 11.5px;
    padding: 1px 5px;
    background: rgba(53, 216, 255, .08);
    border: 1px solid rgba(53, 216, 255, .16);
  }

  .preview {
    border: 1px dashed var(--line-strong);
    padding: 16px 18px;
    min-height: 120px;
  }

  .preview .moment-body h3 { margin: 0 0 10px; font-size: 17px; }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  @media (max-width: 900px) {
    .admin { padding: 96px 16px 70px; }
    .grid2 { grid-template-columns: 1fr; }
    .settings-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="bg-layer layer-a"></div>
  <div class="bg-layer layer-b"></div>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
</div>

<header class="nav">
  <a class="brand" href="index.html" aria-label="BXZERO">
    <span class="brand-word">BX</span>
  </a>
  <nav class="nav-list">
    <a class="nav-item" href="index.html">
      <span class="en">BACK</span>
      <span class="cn">回站点</span>
    </a>
  </nav>
</header>

<main class="admin">

  <h1>写作台</h1>
  <p class="sub">MOMENTS · 写完保存，一分钟左右站点会自己更新</p>

  <!-- 连接设置 -->
  <section class="pane">
    <div class="pane-head">
      <h2>CONNECTION</h2><span class="cn">仓库设置</span>
      <span class="fill"></span>
      <button class="btn" id="save-cfg" type="button">记下设置</button>
    </div>

    <div class="settings-grid">
      <div class="field">
        <label for="cfg-owner">账号</label>
        <input type="text" id="cfg-owner" placeholder="BX-ZERO" autocomplete="off">
      </div>
      <div class="field">
        <label for="cfg-repo">仓库</label>
        <input type="text" id="cfg-repo" placeholder="Personal-website" autocomplete="off">
      </div>
      <div class="field">
        <label for="cfg-branch">分支</label>
        <input type="text" id="cfg-branch" placeholder="main" autocomplete="off">
      </div>
      <div class="field">
        <label for="cfg-token">访问令牌</label>
        <input type="password" id="cfg-token" placeholder="ghp_..." autocomplete="off">
      </div>
    </div>

    <p class="hint">
      令牌在 GitHub 的 <code>Settings → Developer settings → Personal access tokens → Fine-grained tokens</code> 生成，
      只给这一个仓库的 <code>Contents: Read and write</code> 权限就够。令牌只存在这台电脑的浏览器里，不会进仓库。
    </p>
  </section>

  <div class="grid2">

    <!-- 编辑区 -->
    <section class="pane">
      <div class="pane-head">
        <h2>EDITOR</h2><span class="cn">写这一条</span>
        <span class="fill"></span>
        <button class="btn" id="new-entry" type="button">新建</button>
      </div>

      <div class="field">
        <label for="f-date">日期</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label for="f-title">标题</label>
        <input type="text" id="f-title" placeholder="一句话标题" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-body">正文</label>
        <textarea id="f-body" placeholder="支持 **粗体**、`代码`、[链接](https://...)，空一行分段"></textarea>
      </div>

      <div class="row">
        <button class="btn primary" id="btn-save" type="button">保存到仓库</button>
        <button class="btn danger" id="btn-del" type="button">删除这一条</button>
        <button class="btn" id="btn-reload" type="button">从仓库重读</button>
      </div>
      <p class="status" id="status"></p>
    </section>

    <!-- 列表 + 预览 -->
    <section class="pane">
      <div class="pane-head">
        <h2>ENTRIES</h2><span class="cn">已有的</span>
        <span class="fill"></span>
        <span class="cn" id="count"></span>
      </div>

      <ul class="entries" id="entries"></ul>

      <div class="pane-head" style="margin-top:22px">
        <h2>PREVIEW</h2><span class="cn">效果</span>
      </div>
      <div class="preview" id="preview">
        <div class="moment-body">
          <p style="color:var(--dimmer)">左边写点什么，这里会跟着变。</p>
        </div>
      </div>
    </section>

  </div>
</main>

<script>
(function () {
  "use strict";

  var CFG_KEY = "bxz-admin-cfg";

  var els = {
    owner: document.getElementById("cfg-owner"),
    repo: document.getElementById("cfg-repo"),
    branch: document.getElementById("cfg-branch"),
    token: document.getElementById("cfg-token"),
    saveCfg: document.getElementById("save-cfg"),
    date: document.getElementById("f-date"),
    title: document.getElementById("f-title"),
    body: document.getElementById("f-body"),
    save: document.getElementById("btn-save"),
    del: document.getElementById("btn-del"),
    reload: document.getElementById("btn-reload"),
    newEntry: document.getElementById("new-entry"),
    entries: document.getElementById("entries"),
    preview: document.getElementById("preview"),
    status: document.getElementById("status"),
    count: document.getElementById("count")
  };

  var DATA_PATH = "moments.js";
  var list = [];          // 当前全部条目
  var fileSha = null;     // 远端文件版本
  var currentIndex = -1;  // 正在编辑第几条，-1 表示新增

  function loadCfg() {
    var cfg = {};
    try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || "{}"); } catch (e) { cfg = {}; }
    els.owner.value = cfg.owner || "BX-ZERO";
    els.repo.value = cfg.repo || "Personal-website";
    els.branch.value = cfg.branch || "main";
    els.token.value = cfg.token || "";
  }

  function readCfg() {
    return {
      owner: els.owner.value.trim() || "BX-ZERO",
      repo: els.repo.value.trim() || "Personal-website",
      branch: els.branch.value.trim() || "main",
      token: els.token.value.trim()
    };
  }

  function saveCfg() {
    var cfg = readCfg();
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
    setStatus("设置已存在本机。", "ok");
  }

  function setStatus(text, kind) {
    els.status.textContent = text || "";
    els.status.className = "status" + (kind ? " " + kind : "");
  }

  /* ---------- 编码 ---------- */

  function b64encode(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function b64decode(b64) {
    var bin = atob(String(b64).replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* ---------- 文件格式 ---------- */

  var HEADER = "/* ==========================================================\n" +
    "   动态数据\n" +
    "   每一条：{ date: \"YYYY-MM-DD\", title: \"标题\", body: \"正文（Markdown 简写）\" }\n" +
    "   排序：新写的放数组最前面\n" +
    "   这个文件可以直接手改，也可以用 admin.html 在线编辑后保存\n" +
    "   ========================================================== */\n\n" +
    "window.BX_MOMENTS = ";

  function toFileText(items) {
    return HEADER + JSON.stringify(items, null, 2) + ";\n";
  }

  function parseFileText(text) {
    var m = String(text).match(/window\.BX_MOMENTS\s*=\s*([\s\S]*?);?\s*$/);
    if (!m) return [];
    try {
      var arr = JSON.parse(m[1]);
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  /* ---------- 渲染 ---------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function renderBody(text) {
    return String(text || "")
      .split(/\n{2,}/)
      .filter(function (b) { return b.trim(); })
      .map(function (b) { return "<p>" + inline(b).replace(/\n/g, "<br>") + "</p>"; })
      .join("");
  }

  function renderList() {
    els.count.textContent = list.length + " 条";
    if (!list.length) {
      els.entries.innerHTML = '<li class="entry"><span style="color:var(--dimmer)">还没有条目</span></li>';
      return;
    }
    els.entries.innerHTML = list.map(function (m, i) {
      return '<li class="entry' + (i === currentIndex ? " is-on" : "") + '" data-i="' + i + '">' +
        "<time>" + esc(String(m.date || "").replace(/-/g, ".")) + "</time>" +
        "<span>" + esc(m.title || "（无标题）") + "</span>" +
        "</li>";
    }).join("");
  }

  function renderPreview() {
    var t = els.title.value.trim();
    var b = els.body.value;
    els.preview.innerHTML = '<div class="moment-body">' +
      "<h3>" + inline(t || "（无标题）") + "</h3>" +
      (renderBody(b) || '<p style="color:var(--dimmer)">正文还是空的。</p>') +
      "</div>";
  }

  /* ---------- 表单 ---------- */

  function fillForm(item) {
    els.date.value = item ? (item.date || "") : new Date().toISOString().slice(0, 10);
    els.title.value = item ? (item.title || "") : "";
    els.body.value = item ? (item.body || "") : "";
    renderPreview();
  }

  function readForm() {
    return {
      date: els.date.value || new Date().toISOString().slice(0, 10),
      title: els.title.value.trim(),
      body: els.body.value
    };
  }

  /* ---------- GitHub API ---------- */

  function apiUrl(cfg) {
    return "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + DATA_PATH;
  }

  function headers(cfg) {
    return {
      "Authorization": "Bearer " + cfg.token,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    };
  }

  function needToken(cfg) {
    if (!cfg.token) {
      setStatus("先在上面填访问令牌，并点一次「记下设置」。", "err");
      return true;
    }
    return false;
  }

  function loadRemote() {
    var cfg = readCfg();
    if (needToken(cfg)) return Promise.reject(new Error("no token"));
    setStatus("正在读取仓库…");
    return fetch(apiUrl(cfg) + "?ref=" + encodeURIComponent(cfg.branch), { headers: headers(cfg) })
      .then(function (r) {
        if (r.status === 404) {
          fileSha = null;
          list = [];
          renderList();
          setStatus("仓库里还没有这个文件，第一次保存会新建。", "ok");
          return null;
        }
        if (!r.ok) throw new Error("HTTP " + r.status + "（检查令牌权限和仓库名）");
        return r.json();
      })
      .then(function (data) {
        if (!data) return;
        fileSha = data.sha;
        list = parseFileText(b64decode(data.content));
        renderList();
        setStatus("已读取 " + list.length + " 条。", "ok");
      })
      .catch(function (e) {
        if (e.message !== "no token") setStatus("读取失败：" + e.message, "err");
      });
  }

  function putRemote(items, message) {
    var cfg = readCfg();
    if (needToken(cfg)) return Promise.reject(new Error("no token"));
    var payload = {
      message: message,
      content: b64encode(toFileText(items)),
      branch: cfg.branch
    };
    if (fileSha) payload.sha = fileSha;

    setStatus("正在提交…");
    return fetch(apiUrl(cfg), {
      method: "PUT",
      headers: headers(cfg),
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (r.status === 409 || r.status === 422) {
        throw new Error("仓库那边版本对不上，点「从仓库重读」再来一次");
      }
      if (!r.ok) return r.text().then(function (t) { throw new Error("HTTP " + r.status + " " + t.slice(0, 120)); });
      return r.json();
    }).then(function (data) {
      fileSha = data.content && data.content.sha;
      setStatus("已提交。Pages 一般一分钟内重建完，稍等刷新站点。", "ok");
    }).catch(function (e) {
      setStatus("提交失败：" + e.message, "err");
    });
  }

  /* ---------- 动作 ---------- */

  function doSave() {
    var item = readForm();
    if (!item.title && !item.body.trim()) {
      setStatus("标题和正文都是空的，没什么可存。", "err");
      return;
    }
    if (currentIndex >= 0 && currentIndex < list.length) {
      list[currentIndex] = item;
    } else {
      list.unshift(item);
      currentIndex = 0;
    }
    renderList();
    putRemote(list, "动态：" + (item.title || "无标题"));
  }

  function doDelete() {
    if (currentIndex < 0 || currentIndex >= list.length) {
      setStatus("先在上面的列表里点一条要删的。", "err");
      return;
    }
    var title = list[currentIndex].title || "无标题";
    if (!window.confirm("删掉「" + title + "」？")) return;
    list.splice(currentIndex, 1);
    currentIndex = -1;
    fillForm(null);
    renderList();
    putRemote(list, "删除动态：" + title);
  }

  /* ---------- 绑定 ---------- */

  els.saveCfg.addEventListener("click", saveCfg);

  els.newEntry.addEventListener("click", function () {
    currentIndex = -1;
    fillForm(null);
    renderList();
    setStatus("新建一条，写完点保存。", "ok");
  });

  els.save.addEventListener("click", doSave);
  els.del.addEventListener("click", doDelete);
  els.reload.addEventListener("click", loadRemote);

  els.entries.addEventListener("click", function (e) {
    var li = e.target.closest(".entry[data-i]");
    if (!li) return;
    var i = parseInt(li.dataset.i, 10);
    if (isNaN(i) || !list[i]) return;
    currentIndex = i;
    fillForm(list[i]);
    renderList();
    setStatus("正在改「" + (list[i].title || "无标题") + "」。", "ok");
  });

  els.title.addEventListener("input", renderPreview);
  els.body.addEventListener("input", renderPreview);

  /* ---------- 启动 ---------- */

  loadCfg();
  fillForm(null);
  renderList();

  if (readCfg().token) {
    loadRemote();
  } else {
    setStatus("先填令牌，或者直接把下面列表里的当草稿试。", "");
  }
})();
</script>
</body>
</html>
