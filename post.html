<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BXZERO — 动态</title>
<link rel="stylesheet" href="styles.css">
<script>
(function () {
  try {
    if (localStorage.getItem("bxz-theme") === "light") {
      document.documentElement.dataset.theme = "light";
    }
  } catch (e) {}
})();
</script>
<style>
  .post-wrap {
    position: relative;
    z-index: 2;
    max-width: 820px;
    margin: 0 auto;
    padding: 96px 26px 120px;
  }

  .post-back {
    display: inline-block;
    margin-bottom: 30px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--dim);
    text-decoration: none;
  }

  .post-back:hover { color: var(--cyan); }

  .post-date {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: 11.5px;
    letter-spacing: .14em;
    color: var(--dimmer);
  }

  .post-title {
    margin: 12px 0 34px;
    font-size: 32px;
    line-height: 1.35;
    font-weight: 700;
    color: var(--title);
  }

  .article { color: var(--text); font-size: 15.5px; line-height: 1.95; }
  .article p { margin: 0 0 16px; }
  .article h2 { margin: 30px 0 12px; font-size: 22px; color: var(--title); }
  .article h3 { margin: 24px 0 10px; font-size: 18px; color: var(--title); }
  .article strong { color: var(--title); }
  .article a { color: var(--cyan); }
  .article blockquote {
    margin: 20px 0;
    padding: 6px 18px;
    border-left: 2px solid var(--cyan);
    color: var(--dim);
  }
  .article pre {
    margin: 20px 0;
    padding: 14px 16px;
    overflow: auto;
    font-size: 13px;
    line-height: 1.75;
    background: rgba(0, 0, 0, .35);
  }
  .article code {
    padding: 1px 6px;
    font-size: 13px;
    background: rgba(53, 216, 255, .12);
    color: var(--cyan);
  }
  .article ul, .article ol { margin: 16px 0; padding-left: 24px; }
  .article hr { border: 0; border-top: 1px solid var(--line-strong); margin: 28px 0; }

  /* 插图永远不超过版心宽度，也不超过 560px */
  .article img {
    display: block;
    max-width: min(100%, 560px);
    height: auto;
    margin: 22px 0;
    border: 1px solid var(--line);
  }

  .article figure { margin: 22px 0; }
  .article figcaption { margin-top: 8px; font-size: 12px; color: var(--dimmer); }

  .post-hint { color: var(--dimmer); font-size: 14px; }
  .post-hint a { color: var(--cyan); }

  html[data-theme="light"] .article pre { background: #eef2f6; }

  @media (max-width: 720px) {
    .post-wrap { padding: 78px 20px 96px; }
    .post-title { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="bg-layer layer-a"></div>
  <div class="bg-layer layer-b"></div>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
</div>

<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="nav">
  <a class="brand" href="index.html" aria-label="BXZERO">
    <span class="brand-word">BX-ZERO</span>
  </a>
  <nav class="nav-list">
    <a class="nav-item is-active" href="index.html">
      <span class="en">MOMENTS</span>
      <span class="cn">动态</span>
    </a>
  </nav>
</header>

<main class="post-wrap">
  <a class="post-back" href="index.html">← 回到动态</a>
  <article id="post"></article>
</main>

<script src="moments.js"></script>
<script>
(function () {
  "use strict";

  var list = Array.isArray(window.BX_MOMENTS) ? window.BX_MOMENTS.slice() : [];
  var box = document.getElementById("post");

  list.sort(function (a, b) {
    return String(b.date || "").localeCompare(String(a.date || ""));
  });

  function bodyToHtml(text) {
    var s = String(text || "");
    if (!s.trim()) return "";
    if (/<\/?(p|div|h[1-6]|ul|ol|li|blockquote|pre|img|br|strong|em|span|a|table|hr|figure)\b/i.test(s)) {
      return s;
    }
    return s.split(/\n{2,}/).map(function (para) {
      return "<p>" + para.replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  function stamp(date) {
    return String(date || "").replace(/-/g, ".");
  }

  var params = new URLSearchParams(window.location.search);
  var index = parseInt(params.get("i"), 10);
  var want = params.get("t") || "";
  var item = null;

  if (!isNaN(index) && list[index] && (!want || list[index].title === want)) {
    item = list[index];
  }

  if (!item && want) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].title === want) { item = list[i]; break; }
    }
  }

  if (!item) {
    box.innerHTML = '<p class="post-hint">这条动态不在了。<a href="index.html">回到列表</a></p>';
    return;
  }

  document.title = "BXZERO — " + (item.title || "动态");

  box.innerHTML =
    '<div class="post-date">' + stamp(item.date) + "</div>" +
    '<h1 class="post-title">' + (item.title || "（无标题）") + "</h1>" +
    '<div class="article">' + bodyToHtml(item.body) + "</div>";
})();
</script>
</body>
</html>
