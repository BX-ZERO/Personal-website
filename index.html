<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BXZERO</title>
<link rel="icon" href="img/bx-icon.ico" sizes="any">
<link rel="icon" type="image/png" href="img/bx-icon.png">
<link rel="apple-touch-icon" href="img/bx-icon.png">
<link rel="stylesheet" href="styles.css?v=20261116p">
</head>
<body>

<!-- 背景：两层缓慢推拉 + 网格 + 扫描线 -->
<div class="bg" aria-hidden="true">
  <div class="bg-layer layer-a"></div>
  <div class="bg-layer layer-b"></div>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
</div>

<!-- 四角装饰框 -->
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="nav">
  <a class="brand" href="#/home" data-view="home" aria-label="BXZERO">
    <span class="brand-word">BX-ZERO</span>
  </a>

  <nav class="nav-list">
    <a class="nav-item is-active" href="#/home" data-view="home">
      <span class="en">INDEX</span>
      <span class="cn">首页</span>
    </a>
    <a class="nav-item" href="#/moments" data-view="moments">
      <span class="en">MOMENTS</span>
      <span class="cn">动态</span>
    </a>
    <a class="nav-item" href="#/tools" data-view="tools">
      <span class="en">TOOLBOX</span>
      <span class="cn">工具箱</span>
    </a>
    <a class="nav-item" href="#/account" data-view="account">
      <span class="en">ACCOUNT</span>
      <span class="cn">账号</span>
    </a>
  </nav>

  <div class="nav-tools">
    <button class="tool-btn" id="sound-toggle" type="button" aria-pressed="false" title="音乐">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="spk">
          <ellipse cx="8.4" cy="16.8" rx="3.1" ry="2.4"></ellipse>
          <rect x="10.6" y="4.4" width="1.8" height="12.6" rx="0.5"></rect>
          <path d="M12.4 4.4 19.4 6.2v3.5l-7-1.8z"></path>
        </g>
        <line class="slash" x1="4.6" y1="19.4" x2="19.4" y2="4.6"></line>
      </svg>
    </button>
    <div class="player" id="player" hidden>
      <span class="pl-name" id="pl-name">正在载入…</span>
      <div class="pl-row">
        <button class="pl-btn" id="pl-prev" type="button" title="上一首"></button>
        <button class="pl-btn pl-play" id="pl-play" type="button" title="播放 / 暂停"></button>
        <button class="pl-btn" id="pl-next" type="button" title="下一首"></button>
      </div>
      <div class="pl-vol">
        <svg class="pl-spk" id="pl-spk" viewBox="0 0 24 24" aria-hidden="true">
          <path class="spk" d="M4 9.2h3.6L13 5v14l-5.4-4.2H4z"></path>
          <path class="wave" d="M16.2 8.6a4.8 4.8 0 0 1 0 6.8"></path>
          <line class="slash" x1="4.6" y1="19.4" x2="19.4" y2="4.6"></line>
        </svg>
        <input type="range" id="pl-vol" min="0" max="100" step="1" value="35" aria-label="音量">
        <span class="pl-pct" id="pl-pct">35%</span>
      </div>
    </div>
    <button class="tool-btn" id="theme-toggle" type="button" aria-pressed="false" title="夜间 / 白天">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle class="sun-core" cx="12" cy="12" r="4.4"></circle>
        <g class="sun-rays">
          <line x1="12" y1="2.4" x2="12" y2="5.2"></line>
          <line x1="12" y1="18.8" x2="12" y2="21.6"></line>
          <line x1="2.4" y1="12" x2="5.2" y2="12"></line>
          <line x1="18.8" y1="12" x2="21.6" y2="12"></line>
          <line x1="5.2" y1="5.2" x2="7.2" y2="7.2"></line>
          <line x1="16.8" y1="16.8" x2="18.8" y2="18.8"></line>
          <line x1="18.8" y1="5.2" x2="16.8" y2="7.2"></line>
          <line x1="7.2" y1="16.8" x2="5.2" y2="18.8"></line>
        </g>
        <path class="moon" d="M15.6 3.4a8.6 8.6 0 1 0 5 11.6 7 7 0 0 1-5-11.6z"></path>
      </svg>
    </button>
  </div>
</header>

<main>

  <!-- ================= 首页：左侧时间线 ================= -->
  <section class="view is-on" id="view-home">

    <div class="slab">
      <div class="slab-head">
        <h2 id="slab-home"><span class="en">INFORMATION</span><span class="cn">情报</span></h2>
        <span class="slab-line"></span>
        <a class="edit-link" id="edit-home" href="home-edit.html" hidden>EDIT</a>
      </div>

      <div class="info">
        <aside class="info-nav" id="home-nav"></aside>
        <article class="info-body" id="home-body"></article>
      </div>
    </div>

    <div class="peek" id="peek" aria-hidden="true">
      <div class="peek-sheet" id="peek-sheet"></div>
    </div>

  </section>

  <!-- ================= 动态 ================= -->
  <section class="view" id="view-moments">

    <div class="slab">
      <div class="slab-head">
        <h2><span class="en">MOMENTS</span><span class="cn">动态</span></h2>
        <span class="slab-line"></span>
        <a class="edit-link" id="edit-entry" href="edit.html" hidden>EDIT</a>
      </div>

      <ol class="moments" id="moments-list">
        <li class="moment moment-empty">
          <div class="moment-body">
            <p>还没有内容。</p>
          </div>
        </li>
      </ol>
    </div>

  </section>

  <!-- ================= 工具箱 ================= -->
  <section class="view" id="view-tools">

    <div class="slab">
      <div class="slab-head">
        <h2 id="slab-tools"><span class="en">AVAILABLE</span><span class="cn">可用</span></h2>
        <span class="slab-line"></span>
      </div>

      <ul class="tools" id="tool-list"></ul>
    </div>

  </section>

  <!-- ================= 账号 ================= -->
  <section class="view" id="view-account">

    <div class="slab">
      <div class="slab-head">
        <h2><span class="en">ACCOUNT</span><span class="cn">账号</span></h2>
        <span class="slab-line"></span>
      </div>
      <div class="acc" id="acc-box"></div>
    </div>

  </section>

  <!-- ================= 动态详情 ================= -->
  <section class="view" id="view-post">

    <article class="post-wrap">
      <a class="post-back" id="post-back" href="#">← 回到上一页</a>
      <div id="post-body"></div>
    </article>

  </section>

</main>

<footer class="foot">
  <p>BXZERO · <span id="year">2026</span></p>
  <img class="badge" src="img/dsh-badge.png" width="121" height="20" alt="powered by dsh">
  <span class="ver">v1.0.1</span>
</footer>

<script src="home.js?v=20261116p"></script>
<script src="moments.js?v=20261116p"></script>
<script src="auth.js?v=20261116p"></script>
<script src="main.js?v=20261116p"></script>
</body>
</html>
