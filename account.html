<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BXZERO — 账号</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="img/dsh-badge.png">
<style>
  .acc { padding: 34px 2px 10px; }
  .acc-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 24px 26px;
    border: 1px solid var(--line-strong);
    background: var(--card-bg);
    max-width: 560px;
  }
  .acc-avatar {
    width: 58px;
    height: 58px;
    flex: none;
    border: 1px solid var(--line-strong);
    object-fit: cover;
    filter: grayscale(.2);
  }
  .acc-who { min-width: 0; }
  .acc-name {
    font-family: var(--font-en);
    font-size: 17px;
    letter-spacing: .08em;
    color: var(--title);
  }
  .acc-sub { margin-top: 5px; font-size: 12.5px; color: var(--dimmer); }
  .acc-note { font-size: 13.5px; line-height: 1.9; color: var(--text); max-width: 520px; }
  .acc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .acc-actions .m-btn { text-decoration: none; display: inline-block; }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="layer-a"></div>
  <div class="layer-b"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
  <div class="scan"></div>
</div>

<header class="nav">
  <a class="brand" href="index.html" aria-label="BXZERO">
    <span class="brand-word">BX-ZERO</span>
  </a>
  <nav class="nav-list">
    <a class="nav-item" href="index.html">
      <span class="en">INDEX</span><span class="cn">首页</span>
    </a>
    <a class="nav-item" href="index.html#moments">
      <span class="en">MOMENTS</span><span class="cn">动态</span>
    </a>
    <a class="nav-item" href="edit.html">
      <span class="en">EDIT</span><span class="cn">编辑</span>
    </a>
  </nav>
</header>

<main>
  <section class="view is-on">
    <div class="slab">
      <div class="slab-head">
        <h2><span class="en">ACCOUNT</span><span class="cn">账号</span></h2>
        <span class="slab-line"></span>
      </div>
      <div class="acc" id="acc">
        <p class="acc-note">正在确认登录状态…</p>
      </div>
    </div>
  </section>
</main>

<script src="auth.js"></script>
<script>
(function () {
  var box = document.getElementById("acc");

  function note(text) {
    return '<p class="acc-note">' + text + "</p>";
  }

  function signedOut() {
    box.innerHTML = note("这一页只给站主本人用。用 GitHub 登录之后，站点才会给你编辑权限；没登录的人看到的永远是只读。") +
      '<div class="acc-actions">' +
      '<button class="m-btn m-btn-main" id="acc-login" type="button">用 GitHub 登录</button>' +
      '<a class="m-btn" href="index.html">回首页</a>' +
      "</div>";
    document.getElementById("acc-login").addEventListener("click", function () {
      if (window.BXAuth) window.BXAuth.login();
    });
  }

  function signedIn(who) {
    var name = (who && who.login) || "BX-ZERO";
    box.innerHTML =
      '<div class="acc-card">' +
      '<img class="acc-avatar" src="https://github.com/' + encodeURIComponent(name) + '.png?size=116" alt="">' +
      '<div class="acc-who">' +
      '<div class="acc-name">' + name + "</div>" +
      '<div class="acc-sub">已登录，可以写动态了。</div>' +
      "</div></div>" +
      '<div class="acc-actions">' +
      '<a class="m-btn m-btn-main" href="edit.html">进入编辑台</a>' +
      '<button class="m-btn" id="acc-logout" type="button">退出登录</button>' +
      "</div>";
    document.getElementById("acc-logout").addEventListener("click", function () {
      if (window.BXAuth) window.BXAuth.logout();
    });
  }

  if (!window.BXAuth) {
    box.innerHTML = note("auth.js 没加载，登录不可用。");
    return;
  }

  window.BXAuth.me().then(function (who) {
    if (who && who.ok) signedIn(who);
    else signedOut();
  }).catch(function () {
    signedOut();
  });
})();
</script>

</body>
</html>
