<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<script>
(function () {
  try {
    var saved = localStorage.getItem("bxz-theme");
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) { /* file:// 下可能被禁 */ }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BXZERO — 编辑台</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 只属于写作台的样式 */
  .admin {
    max-width: 1180px;
    margin: 0 auto;
    padding: 110px 28px 90px;
  }

  .admin h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .01em;
  }

  .admin .sub {
    margin: 0 0 30px;
    font-size: 12.5px;
    letter-spacing: .16em;
    color: var(--dimmer);
  }

  .pane {
    border: 1px solid var(--line);
    background: rgba(12, 18, 24, .55);
    padding: 20px 22px;
  }

  .pane + .pane { margin-top: 18px; }

  .pane-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  .pane-head h2 {
    margin: 0;
    font-family: var(--font-en);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .24em;
    color: var(--dim);
  }

  .pane-head .cn {
    font-family: var(--font-cn);
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--dimmer);
  }

  .pane-head .fill { flex: 1; }

  .grid2 {
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    gap: 18px;
    align-items: start;
  }

  .field { margin-bottom: 14px; }

  .field > label {
    display: block;
    margin-bottom: 7px;
    font-size: 11.5px;
    letter-spacing: .18em;
    color: var(--dimmer);
  }

  input[type="text"],
  input[type="password"],
  input[type="date"],
  textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text);
    background: rgba(6, 10, 14, .8);
    border: 1px solid var(--line-strong);
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  input:focus,
  textarea:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 2px rgba(53, 216, 255, .1);
  }

  textarea {
    min-height: 300px;
    resize: vertical;
    line-height: 1.75;
  }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .btn {
    padding: 9px 18px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line-strong);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, background .2s ease;
  }

  .btn:hover:not(:disabled) {
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(53, 216, 255, .06);
  }

  .btn:disabled { opacity: .4; cursor: default; }

  .btn.primary {
    color: #041018;
    background: var(--cyan);
    border-color: var(--cyan);
    font-weight: 700;
  }

  .btn.primary:hover:not(:disabled) {
    color: #041018;
    background: #6ee4ff;
  }

  .btn.danger:hover:not(:disabled) {
    color: var(--orange);
    border-color: var(--orange);
    background: rgba(255, 122, 26, .07);
  }

  .entries {
    margin: 0;
    padding: 0;
    list-style: none;
    max-height: 420px;
    overflow-y: auto;
  }

  .entry {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 10px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .2s ease;
  }

  .entry:hover { background: rgba(53, 216, 255, .05); }

  .row-del {
    margin-left: auto;
    width: 22px;
    height: 22px;
    flex: none;
    align-self: center;
    border: 1px solid rgba(255, 255, 255, .16);
    background: transparent;
    color: #89929e;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    opacity: .5;
    transition: color .18s ease, border-color .18s ease, opacity .18s ease;
  }

  .entry:hover .row-del,
  .row-del:focus-visible { opacity: 1; }

  .row-del:hover { color: #ff7a1a; border-color: #ff7a1a; }

  .entry.is-on {
    background: rgba(53, 216, 255, .09);
    box-shadow: inset 2px 0 0 var(--cyan);
  }

  .entry time {
    flex: none;
    font-family: var(--font-en);
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--dimmer);
  }

  .entry span {
    font-size: 13.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .status {
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--dimmer);
    min-height: 18px;
  }

  .status.ok { color: var(--cyan); }
  .status.err { color: var(--orange); }

  .hint {
    font-size: 12px;
    line-height: 1.8;
    color: var(--dimmer);
  }

  .hint code {
    font-family: var(--font-en);
    font-size: 11.5px;
    padding: 1px 5px;
    background: rgba(53, 216, 255, .08);
    border: 1px solid rgba(53, 216, 255, .16);
  }

  .preview {
    border: 1px dashed var(--line-strong);
    padding: 16px 18px;
    min-height: 120px;
  }

  .preview .moment-body h3 { margin: 0 0 10px; font-size: 17px; }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  /* 口令门 */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: grid;
    place-items: center;
    background: #04070a;
    padding: 20px;
  }

  .gate[hidden] { display: none; }

  .gate-box {
    width: 100%;
    max-width: 360px;
    border: 1px solid var(--line-strong);
    background: rgba(10, 16, 22, .96);
    padding: 26px 26px 22px;
  }

  .gate-box h2 {
    margin: 0 0 6px;
    font-family: var(--font-en);
    font-size: 12px;
    letter-spacing: .26em;
    color: var(--dim);
  }

  .gate-box p {
    margin: 0 0 16px;
    font-size: 13px;
    color: #8e9aa8;
  }

  .gate-box input {
    margin-bottom: 12px;
  }

  .gate-box .gate-msg {
    margin: 10px 0 0;
    font-size: 12px;
    color: var(--orange);
    min-height: 16px;
  }

  .gate-box .btn { width: 100%; }

  @media (max-width: 900px) {
    .admin { padding: 96px 16px 70px; }
    .grid2 { grid-template-columns: 1fr; }
    .settings-grid { grid-template-columns: 1fr; }
  }

  /* 仓库设置收进按钮后的横条 */
  .conn-bar { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .conn-who { font-size: 12.5px; color: var(--dimmer); }
  .conn { margin-bottom: 18px; }
  .btn.is-on { border-color: var(--cyan); color: var(--cyan); }

  .two { display: grid; grid-template-columns: 180px 1fr; gap: 14px; }

  /* 富文本区 */
  .rt { border: 1px solid var(--line-strong); }

  .rt-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    background: rgba(0, 0, 0, .22);
  }

  .rt-toolbar button {
    min-width: 30px;
    height: 28px;
    padding: 0 8px;
    font-size: 12px;
    color: var(--dim);
    background: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease;
  }

  .rt-toolbar button:hover { color: var(--cyan); border-color: var(--line-strong); }

  .rt-select {
    height: 28px;
    padding: 0 6px;
    font-size: 12px;
    color: var(--text);
    background: rgba(0, 0, 0, .3);
    border: 1px solid var(--line-strong);
  }

  .rt-sep { width: 1px; height: 18px; background: var(--line-strong); margin: 0 4px; }
  .rt-color { width: 32px; height: 28px; padding: 0; background: none; border: 1px solid var(--line-strong); cursor: pointer; }

  .rt-body {
    min-height: 420px;
    max-height: 64vh;
    overflow: auto;
    padding: 18px 20px;
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
    outline: none;
  }

  .rt-body:empty::before {
    content: "在这里写。选中文字，再点工具条上的按钮。";
    color: var(--dimmer);
  }

  .rt-body img, .article img { max-width: 100%; height: auto; display: block; margin: 16px 0; }
  .rt-body blockquote, .article blockquote {
    margin: 16px 0;
    padding: 6px 16px;
    border-left: 2px solid var(--cyan);
    color: var(--dim);
  }
  .rt-body pre, .article pre {
    margin: 16px 0;
    padding: 12px 14px;
    overflow: auto;
    font-size: 13px;
    line-height: 1.7;
    background: rgba(0, 0, 0, .35);
  }
  .rt-body h2, .article h2 { font-size: 22px; margin: 20px 0 10px; }
  .rt-body h3, .article h3 { font-size: 18px; margin: 16px 0 8px; }
  .rt-body ul, .rt-body ol, .article ul, .article ol { margin: 12px 0; padding-left: 24px; }
  .rt-body a, .article a { color: var(--cyan); }
  .rt-body hr, .article hr { border: 0; border-top: 1px solid var(--line-strong); margin: 22px 0; }

  .article h1 { margin: 0 0 18px; font-size: 25px; letter-spacing: .01em; }
  .article p { margin: 0 0 14px; font-size: 15px; line-height: 1.95; }

  /* 工具条右侧：最近插入的图片名字 */
  .rt-file {
    width: 190px;
    height: 26px;
    padding: 0 8px;
    font-size: 11.5px;
    color: var(--dim);
    background: rgba(0, 0, 0, .28);
    border: 1px solid var(--line-strong);
    outline: none;
  }

  .rt-file.is-busy { border-color: var(--cyan); color: var(--cyan); }
  .rt-file.is-done { border-color: var(--cyan); color: var(--cyan); }
  .rt-file.is-err { border-color: #ff7a1a; color: #ff7a1a; }

  /* 悬停浮出的整页预览 */
  .preview { position: relative; }

  .preview-hint {
    position: absolute;
    right: 12px;
    bottom: 8px;
    font-size: 10.5px;
    letter-spacing: .12em;
    color: var(--dimmer);
    pointer-events: none;
  }

  .float-preview {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4, 7, 10, .72);
    backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .18s ease;
  }

  .float-preview[hidden] { display: none; }
  .float-preview.is-open { opacity: 1; }

  .float-sheet {
    width: min(980px, 92vw);
    height: 84vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    transform: translateY(14px) scale(.985);
    opacity: .4;
    transition: transform .24s cubic-bezier(.2, .8, .3, 1), opacity .24s ease;
  }

  .float-preview.is-open .float-sheet { transform: none; opacity: 1; }

  .float-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
  }

  .float-tag {
    font-family: var(--font-en);
    font-size: 10.5px;
    letter-spacing: .22em;
    color: var(--dimmer);
  }

  .float-close {
    font-size: 11.5px;
    color: var(--dim);
    cursor: pointer;
  }

  .float-close:hover { color: var(--cyan); }

  .float-scroll {
    flex: 1;
    overflow: auto;
    padding: 40px 6%;
  }

  .float-scroll .article { max-width: 760px; margin: 0 auto; }
  .float-scroll .article h1 { font-size: 30px; margin-bottom: 26px; }

  html[data-theme="light"] .float-sheet { background: #fff; }
  html[data-theme="light"] .rt-file { background: #fff; border-color: #d8dee6; color: #4a5561; }

  /* 白天模式：把写死的深色底换成浅色 */
  html[data-theme="light"] .pane { background: #fff; border-color: #d8dee6; }
  html[data-theme="light"] .pane input,
  html[data-theme="light"] .pane textarea { background: #f6f8fa; border-color: #d8dee6; color: #10161d; }
  html[data-theme="light"] .entry:hover { background: rgba(53, 216, 255, .08); }
  html[data-theme="light"] .row-del { border-color: rgba(0, 0, 0, .18); color: #6d7783; }
  html[data-theme="light"] .preview { background: #f6f8fa; }
  html[data-theme="light"] .gate { background: #eef2f6; }
  html[data-theme="light"] .gate-box { background: #fff; }
  html[data-theme="light"] .gate-box p { color: #5b6570; }
  html[data-theme="light"] .btn { border-color: #cfd6df; color: #3d4753; }
  html[data-theme="light"] .btn:hover { border-color: var(--cyan); color: var(--cyan); }
  html[data-theme="light"] .rt { border-color: #d8dee6; }
  html[data-theme="light"] .rt-toolbar { background: #eef2f6; border-color: #d8dee6; }
  html[data-theme="light"] .rt-toolbar button { color: #4a5561; }
  html[data-theme="light"] .rt-toolbar button:hover { border-color: #cfd6df; color: var(--cyan); }
  html[data-theme="light"] .rt-select { background: #fff; border-color: #d8dee6; color: #10161d; }
  html[data-theme="light"] .rt-body { color: #10161d; }
  html[data-theme="light"] .rt-body pre { background: #eef2f6; }
  html[data-theme="light"] .rt-body blockquote { color: #5b6570; }
</style>
</head>
<body>

<!-- 口令门：没口令就进不了编辑界面 -->
<div class="gate" id="gate">
  <div class="gate-box">
    <h2>RESTRICTED</h2>
    <p>这一页只给站主用。点下面的按钮，用你的 GitHub 账号登录。</p>
    <input type="password" id="gate-input" hidden autocomplete="off">
    <button class="btn primary" id="gate-ok" type="button">用 GitHub 登录</button>
    <p class="gate-msg" id="gate-msg"></p>
  </div>
</div>

<div class="bg" aria-hidden="true">
  <div class="bg-layer layer-a"></div>
  <div class="bg-layer layer-b"></div>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
</div>

<header class="nav">
  <a class="brand" href="index.html" aria-label="BXZERO">
    <span class="brand-word">BX-ZERO</span>
  </a>
  <nav class="nav-list">
    <a class="nav-item" href="index.html">
      <span class="en">BACK</span>
      <span class="cn">回站点</span>
    </a>
  </nav>
  <div class="nav-tools">
    <button class="tool-btn" id="theme-toggle" type="button" aria-pressed="false" title="夜间 / 白天">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle class="sun-core" cx="12" cy="12" r="4.4"></circle>
        <g class="sun-rays">
          <line x1="12" y1="2.4" x2="12" y2="5.2"></line>
          <line x1="12" y1="18.8" x2="12" y2="21.6"></line>
          <line x1="2.4" y1="12" x2="5.2" y2="12"></line>
          <line x1="18.8" y1="12" x2="21.6" y2="12"></line>
          <line x1="5.2" y1="5.2" x2="7.2" y2="7.2"></line>
          <line x1="16.8" y1="16.8" x2="18.8" y2="18.8"></line>
          <line x1="18.8" y1="5.2" x2="16.8" y2="7.2"></line>
          <line x1="7.2" y1="16.8" x2="5.2" y2="18.8"></line>
        </g>
        <path class="moon" d="M15.6 3.4a8.6 8.6 0 1 0 5 11.6 7 7 0 0 1-5-11.6z"></path>
      </svg>
    </button>
  </div>
</header>

<main class="admin">

  <h1>写作台</h1>
  <p class="sub">MOMENTS · 写完保存，一分钟左右站点会自己更新</p>

  <!-- 连接设置：收进按钮 -->
  <div class="conn-bar">
    <button class="btn" id="conn-toggle" type="button" aria-expanded="false">仓库设置</button>
    <span class="conn-who" id="auth-state">正在确认…</span>
  </div>

  <section class="pane conn" id="conn-pane" hidden>
    <div class="pane-head">
      <h2>CONNECTION</h2><span class="cn">仓库设置</span>
      <span class="fill"></span>
      <button class="btn" id="save-cfg" type="button">记下设置</button>
    </div>

    <div class="settings-grid">
      <div class="field">
        <label for="cfg-owner">账号</label>
        <input type="text" id="cfg-owner" placeholder="BX-ZERO" autocomplete="off">
      </div>
      <div class="field">
        <label for="cfg-repo">仓库</label>
        <input type="text" id="cfg-repo" placeholder="Personal-website" autocomplete="off">
      </div>
      <div class="field">
        <label for="cfg-branch">分支</label>
        <input type="text" id="cfg-branch" placeholder="main" autocomplete="off">
      </div>
      <div class="field">
        <label>登录状态</label>
        <div id="auth-state2" style="font-size:12.5px;opacity:.75;padding:9px 0;">正在确认…</div>
      </div>
    </div>

    <p class="hint">
      读取走公开接口，写入由 Worker 代为提交，仓库令牌不进浏览器。
      登录票据存在这台电脑的浏览器里，三十天后失效。
    </p>
  </section>

  <!-- 编辑区：整宽 -->
  <section class="pane editor">
    <div class="pane-head">
      <h2>EDITOR</h2><span class="cn">写这一条</span>
      <span class="fill"></span>
      <button class="btn" id="new-entry" type="button">新建</button>
    </div>

    <div class="two">
      <div class="field">
        <label for="f-date">日期</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label for="f-title">标题</label>
        <input type="text" id="f-title" placeholder="一句话标题" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label>正文</label>
      <div class="rt">
        <div class="rt-toolbar" id="rt-toolbar">
          <select class="rt-select" data-block>
            <option value="p">正文</option>
            <option value="h2">大标题</option>
            <option value="h3">小标题</option>
            <option value="blockquote">引用</option>
            <option value="pre">代码块</option>
          </select>
          <select class="rt-select" data-size>
            <option value="">字号</option>
            <option value="12px">12</option>
            <option value="14px">14</option>
            <option value="16px">16</option>
            <option value="18px">18</option>
            <option value="22px">22</option>
            <option value="28px">28</option>
          </select>
          <span class="rt-sep"></span>
          <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
          <button type="button" data-cmd="italic" title="倾斜"><i>I</i></button>
          <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
          <button type="button" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
          <input type="color" class="rt-color" id="rt-color" value="#35d8ff" title="文字颜色">
          <span class="rt-sep"></span>
          <button type="button" data-cmd="justifyLeft" title="左对齐">左</button>
          <button type="button" data-cmd="justifyCenter" title="居中">中</button>
          <button type="button" data-cmd="justifyRight" title="右对齐">右</button>
          <span class="rt-sep"></span>
          <button type="button" data-cmd="insertUnorderedList" title="无序列表">•</button>
          <button type="button" data-cmd="insertOrderedList" title="有序列表">1.</button>
          <button type="button" id="rt-link" title="插入链接">链接</button>
          <button type="button" id="rt-img" title="插入图片">图片</button>
          <button type="button" id="rt-hr" title="分隔线">分隔</button>
          <button type="button" id="rt-clear" title="清除格式">清</button>
          <span class="rt-sep"></span>
          <input class="rt-file" id="rt-file-name" type="text" readonly placeholder="还没有插图" title="最近插入的图片">
        </div>
        <div class="rt-body" id="f-body" contenteditable="true"></div>
      </div>
      <input type="file" id="img-file" accept="image/*" multiple hidden>
    </div>

    <div class="row">
      <button class="btn primary" id="btn-save" type="button">保存到仓库</button>
      <button class="btn danger" id="btn-del" type="button">删除这一条</button>
      <button class="btn" id="btn-reload" type="button">从仓库重读</button>
      <span class="status" id="status"></span>
    </div>
  </section>

  <div class="grid2">
    <section class="pane">
      <div class="pane-head">
        <h2>ENTRIES</h2><span class="cn">已有的</span>
        <span class="fill"></span>
        <span class="cn" id="count"></span>
      </div>

      <ul class="entries" id="entries"></ul>
    </section>

    <section class="pane">
      <div class="pane-head">
        <h2>PREVIEW</h2><span class="cn">效果</span>
      </div>
      <div class="preview" id="preview">
        <div class="moment-body">
          <p style="color:var(--dimmer)">左边写点什么，这里会跟着变。</p>
        </div>
        <span class="preview-hint">鼠标停在这里，浮出整页效果</span>
      </div>
    </section>
  </div>
</main>

<div class="float-preview" id="float-preview" hidden>
  <div class="float-sheet">
    <div class="float-head">
      <span class="float-tag">POST PREVIEW</span>
      <span class="float-close" id="float-close">关闭</span>
    </div>
    <div class="float-scroll">
      <div class="article" id="float-body"></div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 登录门 ---------- */

  var gate = document.getElementById("gate");
  var gateOk = document.getElementById("gate-ok");
  var gateMsg = document.getElementById("gate-msg");
  var authState = document.getElementById("auth-state");

  function openGate(ok) {
    if (ok) {
      gate.hidden = true;
      gate.style.display = "none";
    } else {
      gate.hidden = false;
      gate.style.display = "";
    }
  }

  function signIn() {
    if (window.BXAuth) window.BXAuth.login();
    else gateMsg.textContent = "auth.js 没加载，检查同目录下有没有这个文件。";
  }

  gateOk.addEventListener("click", signIn);

  function checkWho() {
    if (!window.BXAuth) return Promise.resolve({ ok: false });
    return window.BXAuth.me();
  }

  checkWho().then(function (who) {
    var ok = !!(who && who.ok);
    openGate(ok);
    if (authState) authState.textContent = ok ? "已登录：" + who.login : "未登录";
    if (ok) loadRemote();
    else setStatus("用 GitHub 登录之后才能读写仓库。", "");
  });

  var CFG_KEY = "bxz-admin-cfg";

  var els = {
    owner: document.getElementById("cfg-owner"),
    repo: document.getElementById("cfg-repo"),
    branch: document.getElementById("cfg-branch"),
    saveCfg: document.getElementById("save-cfg"),
    date: document.getElementById("f-date"),
    title: document.getElementById("f-title"),
    body: document.getElementById("f-body"),
    save: document.getElementById("btn-save"),
    del: document.getElementById("btn-del"),
    reload: document.getElementById("btn-reload"),
    newEntry: document.getElementById("new-entry"),
    entries: document.getElementById("entries"),
    preview: document.getElementById("preview"),
    status: document.getElementById("status"),
    count: document.getElementById("count")
  };

  var DATA_PATH = "moments.js";
  var list = [];          // 当前全部条目
  var fileSha = null;     // 远端文件版本
  var currentIndex = -1;  // 正在编辑第几条，-1 表示新增

  function loadCfg() {
    var cfg = {};
    try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || "{}"); } catch (e) { cfg = {}; }
    els.owner.value = cfg.owner || "BX-ZERO";
    els.repo.value = cfg.repo || "Personal-website";
    els.branch.value = cfg.branch || "main";
  }

  function readCfg() {
    return {
      owner: els.owner.value.trim() || "BX-ZERO",
      repo: els.repo.value.trim() || "Personal-website",
      branch: els.branch.value.trim() || "main"
    };
  }

  function saveCfg() {
    var cfg = readCfg();
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
    setStatus("设置已存在本机。", "ok");
  }

  function setStatus(text, kind) {
    els.status.textContent = text || "";
    els.status.className = "status" + (kind ? " " + kind : "");
  }

  /* ---------- 编码 ---------- */

  function b64encode(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function b64decode(b64) {
    var bin = atob(String(b64).replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* ---------- 文件格式 ---------- */

  var HEADER = "/* ==========================================================\n" +
    "   动态数据\n" +
    "   每一条：{ date: \"YYYY-MM-DD\", title: \"标题\", body: \"正文（Markdown 简写）\" }\n" +
    "   排序：新写的放数组最前面\n" +
    "   这个文件可以直接手改，也可以用 edit.html 在线编辑后保存\n" +
    "   ========================================================== */\n\n" +
    "window.BX_MOMENTS = ";

  function toFileText(items) {
    return HEADER + JSON.stringify(items, null, 2) + ";\n";
  }

  function parseFileText(text) {
    var m = String(text).match(/window\.BX_MOMENTS\s*=\s*([\s\S]*?);?\s*$/);
    if (!m) return [];
    try {
      var arr = JSON.parse(m[1]);
      if (Array.isArray(arr)) return arr;
    } catch (e) {
      /* 手写的对象字面量键没引号，JSON 会拒，退回求值 */
    }
    try {
      var made = new Function("return (" + m[1] + ");")();
      return Array.isArray(made) ? made : [];
    } catch (e2) {
      setStatus("文件解析失败：" + e2.message, "err");
      return [];
    }
  }

  /* ---------- 渲染 ---------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function renderBody(text) {
    return String(text || "")
      .split(/\n{2,}/)
      .filter(function (b) { return b.trim(); })
      .map(function (b) { return "<p>" + inline(b).replace(/\n/g, "<br>") + "</p>"; })
      .join("");
  }

  function renderList() {
    els.count.textContent = list.length + " 条";
    if (!list.length) {
      els.entries.innerHTML = '<li class="entry"><span style="color:var(--dimmer)">还没有条目</span></li>';
      return;
    }
    els.entries.innerHTML = list.map(function (m, i) {
      return '<li class="entry' + (i === currentIndex ? " is-on" : "") + '" data-i="' + i + '">' +
        "<time>" + esc(String(m.date || "").replace(/-/g, ".")) + "</time>" +
        "<span>" + esc(m.title || "（无标题）") + "</span>" +
        '<button class="row-del" type="button" data-del="' + i + '" title="删除这条">×</button>' +
        "</li>";
    }).join("");
  }

  function bodyToHtml(text) {
    var s = String(text || "");
    if (!s.trim()) return "";
    if (/<\/?(p|div|h[1-6]|ul|ol|li|blockquote|pre|img|br|strong|em|span|a|table|hr)\b/i.test(s)) return s;
    return renderBody(s);
  }

  function renderPreview() {
    var t = els.title.value.trim();
    var html = bodyToHtml(els.body.innerHTML);
    var inner = "<h1>" + inline(t || "（无标题）") + "</h1>" +
      (html || '<p style="color:var(--dimmer)">正文还是空的。</p>');
    els.preview.innerHTML = '<div class="article">' + inner + "</div>" +
      '<span class="preview-hint">鼠标停在这里，浮出整页效果</span>';
    var fb = document.getElementById("float-body");
    if (fb) fb.innerHTML = inner;
  }

  /* ---------- 表单 ---------- */

  function fillForm(item) {
    els.date.value = item ? (item.date || "") : new Date().toISOString().slice(0, 10);
    els.title.value = item ? (item.title || "") : "";
    els.body.innerHTML = item ? bodyToHtml(item.body) : "";
    renderPreview();
  }

  function readForm() {
    return {
      date: els.date.value || new Date().toISOString().slice(0, 10),
      title: els.title.value.trim(),
      body: els.body.innerHTML
    };
  }

  /* ---------- GitHub API ---------- */

  function apiUrl(cfg) {
    return "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + DATA_PATH;
  }

  function loadRemote() {
    if (!window.BXAuth) {
      setStatus("auth.js 没加载，读不了仓库。", "err");
      return Promise.reject(new Error("no auth"));
    }
    setStatus("正在读取仓库…");
    return window.BXAuth.read(DATA_PATH)
      .then(function (data) {
        if (data.missing) {
          fileSha = null;
          list = [];
          renderList();
          setStatus("仓库里还没有这个文件，第一次保存会新建。", "ok");
          return;
        }
        fileSha = data.sha;
        list = parseFileText(data.text);
        renderList();
        setStatus("已读取 " + list.length + " 条。", "ok");
      })
      .catch(function (e) {
        setStatus("读取失败：" + e.message, "err");
      });
  }

  function putRemote(items, message) {
    if (!window.BXAuth) {
      setStatus("auth.js 没加载，无法提交。", "err");
      return Promise.reject(new Error("no auth"));
    }
    setStatus("正在提交…");
    return window.BXAuth.save(DATA_PATH, toFileText(items), message)
      .then(function () {
        setStatus("已提交。Pages 一般一分钟内重建完，稍等刷新站点。", "ok");
        return loadRemote();
      })
      .catch(function (e) {
        setStatus("提交失败：" + e.message, "err");
      });
  }

  /* ---------- 动作 ---------- */

  function doSave() {
    var item = readForm();
    if (!item.title && !item.body.trim()) {
      setStatus("标题和正文都是空的，没什么可存。", "err");
      return;
    }
    if (currentIndex >= 0 && currentIndex < list.length) {
      list[currentIndex] = item;
    } else {
      list.unshift(item);
      currentIndex = 0;
    }
    renderList();
    putRemote(list, "更新动态");
  }

  function deleteAt(index) {
    if (index < 0 || index >= list.length) {
      setStatus("先在上面的列表里点一条要删的。", "err");
      return;
    }
    var title = list[index].title || "无标题";
    if (!window.confirm("删掉「" + title + "」？")) return;
    list.splice(index, 1);
    currentIndex = -1;
    fillForm(null);
    renderList();
    putRemote(list, "删除动态");
  }

  function doDelete() {
    deleteAt(currentIndex);
  }

  /* ---------- 绑定 ---------- */

  els.saveCfg.addEventListener("click", saveCfg);

  els.newEntry.addEventListener("click", function () {
    currentIndex = -1;
    fillForm(null);
    renderList();
    setStatus("新建一条，写完点保存。", "ok");
  });

  els.save.addEventListener("click", doSave);
  els.del.addEventListener("click", doDelete);
  els.reload.addEventListener("click", loadRemote);

  els.entries.addEventListener("click", function (e) {
    var del = e.target.closest("[data-del]");
    if (del) {
      e.stopPropagation();
      deleteAt(parseInt(del.dataset.del, 10));
      return;
    }
    var li = e.target.closest(".entry[data-i]");
    if (!li) return;
    var i = parseInt(li.dataset.i, 10);
    if (isNaN(i) || !list[i]) return;
    currentIndex = i;
    fillForm(list[i]);
    renderList();
    setStatus("正在改「" + (list[i].title || "无标题") + "」。", "ok");
  });

  els.title.addEventListener("input", renderPreview);
  els.body.addEventListener("input", renderPreview);

  /* ---------- 仓库设置：收进按钮 ---------- */

  var connToggle = document.getElementById("conn-toggle");
  var connPane = document.getElementById("conn-pane");

  if (connToggle && connPane) {
    connToggle.addEventListener("click", function () {
      var open = connPane.hidden;
      connPane.hidden = !open;
      connToggle.setAttribute("aria-expanded", open ? "true" : "false");
      connToggle.classList.toggle("is-on", open);
    });
  }

  /* ---------- 富文本工具条 ---------- */

  var toolbar = document.getElementById("rt-toolbar");
  var savedRange = null;

  function rememberRange() {
    var sel = window.getSelection();
    if (sel && sel.rangeCount && els.body.contains(sel.anchorNode)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    }
  }

  function restoreRange() {
    if (!savedRange) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }

  function exec(cmd, value) {
    els.body.focus();
    restoreRange();
    document.execCommand(cmd, false, value === undefined ? null : value);
    rememberRange();
    renderPreview();
  }

  if (toolbar) {
    document.addEventListener("selectionchange", function () {
      if (document.activeElement === els.body) rememberRange();
    });

    toolbar.addEventListener("mousedown", function (e) {
      if (e.target.closest("button")) e.preventDefault();
    });

    toolbar.querySelectorAll("button[data-cmd]").forEach(function (b) {
      b.addEventListener("click", function () { exec(b.dataset.cmd); });
    });

    var blockSel = toolbar.querySelector("[data-block]");
    if (blockSel) {
      blockSel.addEventListener("change", function () {
        exec("formatBlock", "<" + blockSel.value + ">");
      });
    }

    var sizeSel = toolbar.querySelector("[data-size]");
    if (sizeSel) {
      sizeSel.addEventListener("change", function () {
        var px = sizeSel.value;
        if (!px) return;
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount || sel.isCollapsed) {
          setStatus("先选中要改字号的文字。", "err");
          return;
        }
        var range = sel.getRangeAt(0);
        var span = document.createElement("span");
        span.style.fontSize = px;
        try {
          span.appendChild(range.extractContents());
          range.insertNode(span);
          renderPreview();
        } catch (err) {
          setStatus("字号调整失败：" + err.message, "err");
        }
      });
    }

    var colorInput = document.getElementById("rt-color");
    if (colorInput) {
      colorInput.addEventListener("input", function () { exec("foreColor", colorInput.value); });
    }

    var linkBtn = document.getElementById("rt-link");
    if (linkBtn) {
      linkBtn.addEventListener("click", function () {
        var href = window.prompt("链接地址", "https://");
        if (href) exec("createLink", href);
      });
    }

    var hrBtn = document.getElementById("rt-hr");
    if (hrBtn) {
      hrBtn.addEventListener("click", function () {
        els.body.focus();
        restoreRange();
        document.execCommand("insertHorizontalRule", false, null);
        renderPreview();
      });
    }

    var clearBtn = document.getElementById("rt-clear");
    if (clearBtn) {
      clearBtn.addEventListener("click", function () { exec("removeFormat"); });
    }

    /* ---------- 插入图片：压缩后传到仓库 media/ ---------- */

    var imgBtn = document.getElementById("rt-img");
    var imgFile = document.getElementById("img-file");
    var fileNameBox = document.getElementById("rt-file-name");

    function noteFile(text, state) {
      if (!fileNameBox) return;
      fileNameBox.value = text;
      fileNameBox.classList.remove("is-busy", "is-done", "is-err");
      if (state) fileNameBox.classList.add(state);
    }

    if (imgBtn && imgFile) {
      imgBtn.addEventListener("click", function () { imgFile.click(); });

      imgFile.addEventListener("change", function () {
        var files = Array.prototype.slice.call(imgFile.files || []);
        if (!files.length) return;
        setStatus("正在处理 " + files.length + " 张图片…");
        files.reduce(function (chain, file) {
          return chain.then(function () { return sendImage(file); });
        }, Promise.resolve()).then(function () {
          imgFile.value = "";
          renderPreview();
          setStatus("图片已插入。", "ok");
        }).catch(function (err) {
          setStatus("图片上传失败：" + (err && err.message ? err.message : err), "err");
        });
      });
    }

    function shrink(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error("读不了文件")); };
        reader.onload = function () {
          var img = new Image();
          img.onerror = function () { reject(new Error("不是有效图片")); };
          img.onload = function () {
            var max = 1600;
            var w = img.width;
            var h = img.height;
            if (w > max) { h = Math.round(h * max / w); w = max; }
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            var type = /png/i.test(file.type) ? "image/png" : "image/jpeg";
            var data = canvas.toDataURL(type, 0.88);
            resolve({ data: data, type: type });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function sendImage(file) {
      var label = file.name || "图片";
      var safe = label.replace(/"/g, "");
      noteFile("上传中… " + label, "is-busy");

      return shrink(file).then(function (out) {
        var base64 = out.data.split(",")[1];
        var ext = out.type === "image/png" ? "png" : "jpg";
        var name = "media/" + Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "." + ext;
        return window.BXAuth.upload(name, base64).then(function (res) {
          var path = (res && res.path) || name;
          els.body.focus();
          restoreRange();
          document.execCommand(
            "insertHTML",
            false,
            '<img src="' + path + '" alt="' + safe + '" title="' + safe + '">'
          );
          rememberRange();
          noteFile(label + " 已插入", "is-done");
        });
      }).catch(function (err) {
        noteFile(label + " 上传失败", "is-err");
        throw err;
      });
    }
  }

  /* ---------- 悬停浮出整页预览 ---------- */

  var floatBox = document.getElementById("float-preview");
  var previewBox = document.getElementById("preview");

  if (floatBox && previewBox) {
    var hoverTimer = null;
    var closeTimer = null;

    function openFloat() {
      clearTimeout(closeTimer);
      floatBox.hidden = false;
      requestAnimationFrame(function () { floatBox.classList.add("is-open"); });
    }

    function closeFloat() {
      floatBox.classList.remove("is-open");
      setTimeout(function () {
        if (!floatBox.classList.contains("is-open")) floatBox.hidden = true;
      }, 200);
    }

    previewBox.addEventListener("mouseenter", function () {
      hoverTimer = setTimeout(openFloat, 240);
    });

    previewBox.addEventListener("mouseleave", function () {
      clearTimeout(hoverTimer);
      closeTimer = setTimeout(closeFloat, 420);
    });

    floatBox.addEventListener("mouseenter", function () { clearTimeout(closeTimer); });
    floatBox.addEventListener("mouseleave", function () { closeFloat(); });
  }

  /* ---------- 启动 ---------- */

  loadCfg();
  fillForm(null);
  renderList();
})();
</script>
<script>
(function () {
  var btn = document.getElementById("theme-toggle");
  if (!btn) return;

  function apply(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    btn.setAttribute("aria-pressed", theme === "light" ? "true" : "false");
    try { localStorage.setItem("bxz-theme", theme); } catch (e) { /* 忽略 */ }
  }

  apply(document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark");

  btn.addEventListener("click", function () {
    apply(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
  });
})();
</script>
</body>
</html>
